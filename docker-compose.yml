# PrintBridge 自托管部署(NAS / 常开主机)
# 用法:docker compose up -d  →  浏览器打开 http://<主机IP>:8000
services:
  server:
    build: ./server
    container_name: printbridge
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 生产用 PostgreSQL;数据卷见 volumes 段
      PB_DATABASE_URL: postgresql+asyncpg://printbridge:printbridge@db:5432/printbridge
      PB_ROLE: server
    volumes:
      - printbridge-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: printbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: printbridge
      POSTGRES_PASSWORD: printbridge
      POSTGRES_DB: printbridge
    volumes:
      - printbridge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # P1 预留:worker 模式启用;P0 队列在进程内,暂不依赖 redis
  redis:
    image: redis:7-alpine
    container_name: printbridge-redis
    restart: unless-stopped
    volumes:
      - printbridge-redis:/data

volumes:
  printbridge-data:
  printbridge-db:
  printbridge-redis:
