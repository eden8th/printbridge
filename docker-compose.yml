# PrintBridge 自托管部署(NAS / 常开主机)
#
# 首次使用请先准备构建依赖(仓库不收录第三方二进制与前端产物):
#     python tools/prepare.py
#
# 然后:
#     docker compose up -d --build
# 浏览器打开 http://<主机IP>:8002
#
# 端口 8000 已被部分服务器上的其他服务占用,宿主机侧映射到 8002;
# 需要改端口改下面的 ports 即可。
#
# name 显式钉住 compose 项目名:默认取目录名,而"项目名相同"是全局作用域——
# 在任何另一个同名目录下执行 docker compose down -v,会连带删掉本项目的
# 容器与数据卷,包括本目录这一套。钉死名字后,克隆到别处测试也不会误伤。
name: printbridge

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: printbridge
    restart: unless-stopped
    ports:
      - "8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 访问 camera 容器(1984)
    environment:
      # 生产用 PostgreSQL;数据卷见 volumes 段
      PB_DATABASE_URL: postgresql+asyncpg://printbridge:${PB_DB_PASSWORD:-printbridge}@db:5432/printbridge
      # 容器内只看到 Docker 网桥,扫描不到真实局域网,需显式指定打印机所在网段。
      # 留空则只能手动填 IP。查本机网段:ip route | grep -o '192\.168\.[0-9]*\.0/24' | head -1
      PB_SCAN_CIDRS: ${PB_SCAN_CIDRS:-}
    volumes:
      - printbridge-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # 摄像头 go2rtc sidecar:host 网络(ICE 候选须为宿主机 LAN IP,
  # bridge 容器地址打印机不可达——实测结论);随镜像带 ffmpeg 做截帧转码;
  # 流由后端按需经 API 注册(webrtc:…#format=creality)
  camera:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: printbridge-camera
    restart: unless-stopped
    network_mode: host
    command: ["go2rtc", "-config", "/app/go2rtc.yaml"]

  db:
    image: postgres:16-alpine
    container_name: printbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: printbridge
      POSTGRES_PASSWORD: ${PB_DB_PASSWORD:-printbridge}
      POSTGRES_DB: printbridge
    volumes:
      - printbridge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  printbridge-data:
  printbridge-db: